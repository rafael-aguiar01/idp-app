trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: Setup Node.js
    inputs:
      versionSpec: '24.x'

  - script: npm install
    displayName: Install dependencies

  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: acridplab-service-connection

  - script: |
      docker run --privileged --rm tonistiigi/binfmt --install arm64
      docker buildx create --use --name idp-builder
      docker buildx inspect --bootstrap
    displayName: Configure ARM64 builder

  - script: |
      docker buildx build \
        --platform linux/arm64 \
        --push \
        -t acridplab.azurecr.io/${{ values.repoName }}:$(Build.SourceVersion) \
        .
    displayName: Build and push image