apiVersion: apps/v1
kind: Deployment

metadata:
  name: ${{ values.repoName }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ${{ values.repoName }}

  template:
    metadata:
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}

    spec:
      containers:
        - name: ${{ values.repoName }}
          image: acridplab.azurecr.io/${{ values.repoName }}:IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi