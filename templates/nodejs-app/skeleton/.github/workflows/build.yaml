name: Build and Push Application Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'kubernetes/deployment.yaml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ '${{ secrets.ACR_LOGIN_SERVER }}' }}
          username: ${{ '${{ secrets.ACR_USERNAME }}' }}
          password: ${{ '${{ secrets.ACR_PASSWORD }}' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ '${{ secrets.ACR_LOGIN_SERVER }}' }}/${{ values.repoName }}:${{ '${{ github.sha }}' }}

      - name: Atualizar imagem no manifesto Kubernetes
        run: |
          sed -i "s|image: acridplab.azurecr.io/${{ values.repoName }}:.*|image: acridplab.azurecr.io/${{ values.repoName }}:${{ '${{ github.sha }}' }}|" kubernetes/deployment.yaml

      - name: Commitar nova versão da imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no manifesto."
            exit 0
          fi

          git commit -m "chore: update image to ${{ '${{ github.sha }}' }}"
          git push