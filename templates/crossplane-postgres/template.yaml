apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: crossplane-postgres-template
  title: Provisionar Banco de Dados (Crossplane)
  description: Cria um banco de dados PostgreSQL utilizando Crossplane e GitOps (Argo CD).
spec:
  owner: platform-team
  type: infrastructure
  
  parameters:
    - title: Detalhes do Banco de Dados
      required:
        - dbName
      properties:
        dbName:
          title: Nome do Banco
          type: string
          description: Nome único para o seu banco de dados (ex. servico-pagamentos).
          pattern: '^[a-z0-9-]+$'

  steps:
    - id: template
      name: Gerando Manifesto do Crossplane
      action: fetch:template
      input:
        url: ./skeleton
        values:
          dbName: ${{ parameters.dbName }}

    - id: publish-pr
      name: Criando Pull Request no idp-gitops
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=idp-gitops&owner=RafaelCaldeiraAguiar
        branchName: feature/db-${{ parameters.dbName }}
        title: "infra: provisiona banco de dados ${{ parameters.dbName }}"
        description: "PR gerado automaticamente pelo Backstage via Software Template."