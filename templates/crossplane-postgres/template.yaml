apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: crossplane-postgres-template
  title: Provisionar Banco PostgreSQL (Crossplane)
  description: Solicita a criação de um banco via Crossplane no idp-gitops.
spec:
  owner: platform-team
  type: infrastructure
  parameters:
    - title: Detalhes do Banco
      required: [dbName]
      properties:
        dbName:
          title: Nome do Banco
          type: string

  steps:
    - id: template
      name: Gerando Manifesto do Crossplane
      action: fetch:template
      input:
        url: ./skeleton
        values:
          dbName: ${{ parameters.dbName }}

    - id: publish-pr
      name: Injetando no Repositório de Infraestrutura
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=idp-gitops&owner=rafael-aguiar01
        branchName: feature/db-${{ parameters.dbName }}
        title: "infra: provisiona banco ${{ parameters.dbName }}"
        description: "PR automatizado. O ArgoCD provisionará o recurso após o merge."